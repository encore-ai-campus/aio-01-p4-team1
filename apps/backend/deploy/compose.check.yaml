# Local verification only. Reuses the uv environment read-only; not a deployed service.
services:
  db-check:
    image: python:3.12-slim@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1
    profiles: [checks]
    working_dir: /workspace
    read_only: true
    tmpfs:
      - /tmp
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      OKE_RUN_DB_TESTS: "1"
      PYTHONPATH: /workspace:/workspace/.venv/lib/python3.12/site-packages
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    volumes:
      - ..:/workspace:ro
    depends_on:
      postgres:
        condition: service_healthy
    command: [python, -m, pytest, tests/integration/test_db_connection.py, -q, --tb=short, -p, "no:cacheprovider"]
