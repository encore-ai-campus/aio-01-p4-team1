# Isolated employee fixture: no live data-api or production identity claims.
services:
  c04-identity-fixture:
    image: python:3.12-slim@sha256:b18b261e1b4974b4f321451ad5251ded85abb22c2b8b262da527dda1d031ab30
    command: [python, -B, /opt/c04-identity-fixture.py, --fixture, /private/employees.json]
    environment:
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?required}
    volumes:
      - ../tools/c04-identity-fixture.py:/opt/c04-identity-fixture.py:ro
      - ../.runtime/c04-employees.json:/private/employees.json:ro
    ports:
      - 127.0.0.1:18802:8802
