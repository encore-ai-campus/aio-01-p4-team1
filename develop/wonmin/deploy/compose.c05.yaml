# Extra services are restricted to the private C05 integration database.
services:
  c05-backend:
    build:
      context: ../.runtime/peer-jihye-ec6a735
      dockerfile: ../../deploy/Backend.lab.Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://wonmin_lab:${LAB_DB_PASSWORD:?required}@postgres:5432/wonmin_c05_app
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?required}
      SERVICE_MODE: app
    ports:
      - 127.0.0.1:18001:8000
    depends_on:
      postgres:
        condition: service_healthy
  c05-proxy:
    image: python:3.12-slim@sha256:b18b261e1b4974b4f321451ad5251ded85abb22c2b8b262da527dda1d031ab30
    command: [python, -B, /opt/wonmin/c05-fault-proxy.py, --host, 0.0.0.0, --port, '8801']
    environment:
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?required}
      WONMIN_C05_UPSTREAM: http://c05-backend:8000
      WONMIN_C05_FAULTS: ${WONMIN_C05_FAULTS:-{}}
    volumes:
      - ../tools/c05-fault-proxy.py:/opt/wonmin/c05-fault-proxy.py:ro
    ports:
      - 127.0.0.1:18801:8801
    depends_on:
      - c05-backend
