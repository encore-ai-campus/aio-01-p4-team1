name: wonmin-p13-lab
services:
  postgres:
    image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    environment:
      POSTGRES_DB: wonmin_integration
      POSTGRES_USER: wonmin_lab
      POSTGRES_PASSWORD: ${LAB_DB_PASSWORD:?required}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U wonmin_lab -d wonmin_integration']
      interval: 2s
      timeout: 3s
      retries: 30
  backend:
    build:
      context: ../.runtime/peer-jihye
      dockerfile: ../../deploy/Backend.lab.Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://wonmin_lab:${LAB_DB_PASSWORD}@postgres:5432/wonmin_integration
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?required}
      SERVICE_MODE: app
    ports:
      - 127.0.0.1:18000:8000
    depends_on:
      postgres:
        condition: service_healthy
  mock-store:
    image: python:3.12-slim@sha256:b18b261e1b4974b4f321451ad5251ded85abb22c2b8b262da527dda1d031ab30
    command: [python, -B, /opt/wonmin/mock-store.py, --host, 0.0.0.0, --port, '8800']
    environment:
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?required}
      WONMIN_MOCK_FAULTS: ${WONMIN_MOCK_FAULTS:-{}}
    volumes:
      - ../tools/mock-store.py:/opt/wonmin/mock-store.py:ro
    ports:
      - 127.0.0.1:18800:8800
  n8n:
    image: n8nio/n8n@sha256:8602f5dfacbe2c931eeafd010de0e68182310e9f309921e780ab69182e92b3ae
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?required}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: 'false'
      N8N_SECURE_COOKIE: 'false'
      N8N_DIAGNOSTICS_ENABLED: 'false'
      N8N_PERSONALIZATION_ENABLED: 'false'
      N8N_VERSION_NOTIFICATIONS_ENABLED: 'false'
      SERVICE_MODE: practice
      WONMIN_PRACTICE_STORE_URL: http://mock-store:8800
      WONMIN_APP_STORE_URL: http://backend:8000
      LOCAL_LLM_BASE_URL: http://host.orb.internal:11434
      LOCAL_LLM_MODEL: qwen2.5-coder:latest
    ports:
      - 127.0.0.1:15678:5678
    extra_hosts:
      - host.orb.internal:0.250.250.254
    volumes:
      - n8n_data:/home/node/.n8n
      - ../.runtime/n8n-import:/fixtures/private:ro
    depends_on:
      - mock-store
      - backend
volumes:
  postgres_data:
  n8n_data:
