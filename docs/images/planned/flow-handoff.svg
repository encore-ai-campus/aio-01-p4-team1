<text class="detail" x="60" y="913">티켓 성공·알림 실패면 티켓은 유지하고 미완료 알림 단계만 복구한다. 정상은 DLQ를 만들지 않는다.</text>
<text class="detail" x="60" y="941">알림 실패로 DLQ 시도를 건너뛰지 않는다. 모든 플래그는 실제 저장 ACK 기준.</text>
<text class="detail" x="60" y="969">두 모드는 한 대상만 활성화하며 DLQ 요청·응답 형식은 대상별 어댑터로 맞춘다.</text>
