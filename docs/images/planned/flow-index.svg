<text class="detail" x="60" y="913">임베딩 호출 방식은 초기 구현안이다. 참조 In-Memory 저장 노드를 그대로 운영에 쓰지 않는다.</text>
<text class="detail" x="60" y="941">DB 교체는 한 연결의 거래로 구현한다. 필요한 DB 함수·마이그레이션은 지혜님과 연결한다.</text>
<text class="detail" x="60" y="969">원본 삭제·권한 축소 시 이전 공개 청크가 검색되지 않게 처리하고 별도 시험한다.</text>
