<text class="detail" x="959" y="441">문서 → 벡터 → 권한별 근거</text>
<rect x="490" y="355" width="350" height="110" rx="13" fill="white" stroke="#dce4ef"/>
<rect x="490" y="355" width="6" height="110" rx="3" fill="#bd5050"/>
<text class="type" x="509" y="381" fill="#bd5050">oke-handoff / oke-errors</text>
