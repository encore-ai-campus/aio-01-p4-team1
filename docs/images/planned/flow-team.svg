<text class="detail" x="509" y="441">중복·오류 수습·시험 보고서</text>
<rect x="40" y="355" width="350" height="110" rx="13" fill="white" stroke="#dce4ef"/>
<rect x="40" y="355" width="6" height="110" rx="3" fill="#596d88"/>
