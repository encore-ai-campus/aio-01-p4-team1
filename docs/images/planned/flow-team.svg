<rect x="40" y="180" width="6" height="110" rx="3" fill="#245de8"/>
<text class="type" x="59" y="206" fill="#245de8">로그인 / 질문 / 관리자</text>
<text class="node" x="59" y="237">수언님 · 사용자 화면</text>
<text class="detail" x="59" y="266">직원이 사용할 화면과 API 연결</text>
<rect x="490" y="180" width="350" height="110" rx="13" fill="white" stroke="#dce4ef"/>
<rect x="490" y="180" width="6" height="110" rx="3" fill="#15836c"/>
<text class="type" x="509" y="206" fill="#15836c">FastAPI / PostgreSQL / Compose</text>
