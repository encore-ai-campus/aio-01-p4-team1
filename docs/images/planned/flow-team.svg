<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="1030" viewBox="0 0 1380 1030" role="img" aria-labelledby="title desc">
<title id="title">기능을 연결하는 여섯 역할</title><desc id="desc">구현 전 설계안. 오현님은 공통 기준·우선순위·인계 결과·병합·시연 준비를 관리. 노드 유형과 주요 분기를 설명한다.</desc>
