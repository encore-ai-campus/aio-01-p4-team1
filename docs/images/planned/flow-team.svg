<text class="label" style="font-size:13px" text-anchor="middle" x="890.0" y="383">권한·장애</text>
<text class="label" style="font-size:13px" text-anchor="middle" x="890.0" y="400">시험 자료</text>
<polyline points="490,410 390,410" fill="none" stroke="#8092aa" stroke-width="2.5" marker-end="url(#arrow)"/>
<text class="label" style="font-size:13px" text-anchor="middle" x="440.0" y="383">시험·수정·</text>
<text class="label" style="font-size:13px" text-anchor="middle" x="440.0" y="400">재시험</text>
