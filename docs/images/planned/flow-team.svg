<text class="detail" x="59" y="441">담당별 인계·막힘·배포·제출</text>
<rect x="40" y="884" width="1300" height="112" rx="12" fill="#eaf0fa"/>
<text class="detail" x="60" y="913">흐름은 주요 인계 관계다. 상세 연결 상대는 개인 README와 COORDINATION의 C01~C09를 따른다.</text>
<text class="detail" x="60" y="941">개인 폴더에서 기본안대로 개발하고, 공통 계약 변경 때만 지정 상대와 검토한다.</text>
<text class="detail" x="60" y="969">P0 기반 → P1 필수 연결·시험 → P2 선택 고도화. 구현 상태와 결정 상태를 따로 기록한다.</text>
</svg>